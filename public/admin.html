<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Control de Horas</title>
  <link rel="stylesheet" href="css/admin-styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <h1>Sistema de Gestión de Horas</h1>
  </header>

  <!-- Cuerpo Completo -->
  <div class="body-container">
  <div class="admin-container">
    <h1>Admin - Cargar Horas</h1>
    <p>Minutos Libres: <span id="horas-libres">720</span></p>
    <form id="horas-form">
      <select id="empresa" required>
        <option value="">Seleccionar Empresa</option>
      </select>
      <input type="date" id="fecha" required>
      <input type="number" id="horas-usadas" placeholder="Minutos Usados" required>
      <input type="text" id="solicitante" placeholder="Solicitante" required>
      <input type="text" id="tarea" placeholder="Tarea" required>
      <button type="submit">Cargar Minutos</button>
    </form>
    <!-- Botón de Cerrar Sesión -->
    <button id="registerBtn" class="logout-btn">Registrar Usuario</button>
    <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
    <a href="/view.html" class="view-link">Ir a la pantalla de visualización</a>
  </div></div>

  <!-- Footer -->

  <script src="js/admin.js"></script>
</body>
</html>
